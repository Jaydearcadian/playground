name: Demo Foundry E3 Three.js Render
on:
  push:
    branches: [demo-foundry-e3-threejs-20260809]
    paths:
      - 'demo-foundry-e3/**'
      - '.github/workflows/demo-foundry-e3-threejs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'demo-foundry-e3/**'
      - '.github/workflows/demo-foundry-e3-threejs.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact runtime
        id: runtime
        working-directory: demo-foundry-e3
        run: |
          npm install --no-audit --no-fund
          node -e "import('three').then(m=>{console.log('three revision',m.REVISION); if(m.REVISION!=='185') process.exit(9)})"
      - name: Install Chromium
        working-directory: demo-foundry-e3
        run: npx playwright install --with-deps chromium
      - name: Render deterministic film
        working-directory: demo-foundry-e3
        run: node render.mjs
      - name: Inspect output
        working-directory: demo-foundry-e3
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json Interfold_E3_DemoFoundry053_ThreeJS.mp4 | tee /tmp/render-meta.json
          ls -lh Interfold_E3_DemoFoundry053_ThreeJS.mp4 Interfold_E3_DemoFoundry053_contact_sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: e3-demo-foundry-threejs
          if-no-files-found: error
          path: |
            demo-foundry-e3/Interfold_E3_DemoFoundry053_ThreeJS.mp4
            demo-foundry-e3/Interfold_E3_DemoFoundry053_contact_sheet.jpg
            demo-foundry-e3/keyframes/*.png
          retention-days: 1
      - name: Publish render handle
        if: always() && github.event_name == 'push'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .render-status
          python3 - <<'PY'
          import json, os
          meta=None
          try:
              meta=json.load(open('/tmp/render-meta.json'))
          except Exception:
              pass
          out={
            'status':os.environ.get('JOB_STATUS','unknown'),
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'head_sha':os.environ['GITHUB_SHA'],
            'artifact_name':'e3-demo-foundry-threejs',
            'render_metadata':meta,
          }
          open('.render-status/e3.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name 'demo-foundry-render-bot'
          git config user.email 'demo-foundry-render-bot@users.noreply.github.com'
          git add .render-status/e3.json
          git commit -m 'Record E3 render artifact handle' || true
          git push origin HEAD:demo-foundry-e3-threejs-20260809
